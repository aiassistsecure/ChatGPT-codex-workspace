[workspace]
members = ["crates/core", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/aiassistsecure/ChatGPT-codex-workspace"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nedb-engine = "=2.8.5"
tempfile = "3"
